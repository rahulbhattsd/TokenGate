services:
  - type: web
    name: tokengate-server
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tokengate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tokengate-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CACHE_SIMILARITY_THRESHOLD
        value: "0.95"
      - key: RAG_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: RAG_CHUNK_SIZE
        value: "500"
      - key: RAG_CHUNK_OVERLAP
        value: "75"
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.75"
      - key: RAG_MAX_CONTEXT_TOKENS
        value: "2000"
      - key: RAG_REQUIRE_CONTEXT
        value: "false"
      - key: RAG_MAX_FILE_BYTES
        value: "10485760"
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: tokengate-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: tokengate-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tokengate-server
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: tokengate-db
    plan: free
    databaseName: tokengate
    user: myuser
    postgresMajorVersion: 16

redis:
  - name: tokengate-redis
    plan: free
